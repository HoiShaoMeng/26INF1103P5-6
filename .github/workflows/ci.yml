name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: pip
      - run: pip install -r requirements.txt ruff pytest-cov
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest tests/ --cov=. --cov-report=term-missing

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f dockerfile -t phishing-triage .
      - run: docker run --rm phishing-triage python -m compileall -q .

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commit format
        run: |
          pattern='^(feat|fix|test|docs|refactor|chore|ci|style|perf)(\([a-z-]+\))?: .{1,72}$'
          bad=$(git log --format=%s origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }} | grep -Ev "$pattern" || true)
          if [ -n "$bad" ]; then
            echo "These commit messages don't follow the convention:"
            echo "$bad"
            exit 1
          fi